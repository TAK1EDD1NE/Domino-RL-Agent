# Default training preset for the domino 2v2 MaskablePPO agent (spec section 9).
# Every value can be overridden on the CLI (--steps, --n-envs, --set key=value, ...).
run_name: default
total_steps: 10_000_000
n_envs: 8
n_steps: 512
batch_size: 2048
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
learning_rate: 0.0003
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.02
device: auto
checkpoint_every: 500_000
snapshot_every: 100_000
seed: 0
env:
  reward_mode: differential
  opponent: league
  league_size: 10
  seed: 0
