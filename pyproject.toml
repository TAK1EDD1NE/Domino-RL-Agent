[project]
name = "domino-rl"
version = "0.1.0"
description = "2v2 domino (Algerian rules) environment and deep reinforcement learning agents for the RLOC 2026/2027 project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26,<3",
    "torch>=2.5,<2.6",
    "stable-baselines3==2.7.1",
    "sb3-contrib==2.7.1",
    "pygame>=2.6.0",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "numba>=0.68.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domino"]

# CUDA build of torch is pinned through the official PyTorch wheel index so that
# `uv sync` reproduces a GPU-capable environment (the agent is trained on an
# RTX 3060). The cu121 wheels also run on CPU-only machines, so the project stays
# reproducible for graders without a GPU.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
